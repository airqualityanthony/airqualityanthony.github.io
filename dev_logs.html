<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>On The Air - Dev Logs</title>
	<style>
		@font-face {
			font-family: 'OnTheAirHeading';
			src: url('W95font.otf') format('opentype');
			font-weight: normal;
			font-style: normal;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: 'OnTheAirHeading', Arial, sans-serif;
			background-image: url('imgs/background_latest.png');
			background-size: cover;
			background-position: center top;
			background-repeat: no-repeat;
			background-attachment: scroll;
			color: #ffffff;
			min-height: 100vh;
			padding: 28px 16px;
		}

		main {
			max-width: 760px;
			margin: 100px auto 0;
			background: rgba(0, 0, 0, 0.62);
			border: 1px solid rgba(255, 255, 255, 0.2);
			border-radius: 12px;
			padding: 24px;
			backdrop-filter: blur(2px);
		}

		h1 {
			font-size: clamp(28px, 5vw, 48px);
			letter-spacing: 0.04em;
			margin-bottom: 10px;
			text-shadow: 0 2px 10px rgba(0, 0, 0, 0.65);
		}

		.subtitle {
			opacity: 0.95;
			margin-bottom: 20px;
			line-height: 1.4;
		}

		.log-list {
			list-style: none;
			display: grid;
			gap: 12px;
		}

		.log-item {
			border-radius: 8px;
			overflow: hidden;
			border: 1px solid rgba(255, 255, 255, 0.2);
		}

		.log-link {
			display: block;
			padding: 12px 14px;
			text-decoration: none;
			background: rgba(0, 0, 0, 0.38);
			color: #ffffff;
			transition: background-color 0.2s ease;
		}

		.log-link:hover,
		.log-link:focus-visible {
			background: rgba(0, 0, 0, 0.6);
		}

		.log-date {
			display: block;
			font-size: 1rem;
			margin-bottom: 3px;
			letter-spacing: 0.03em;
		}

		.log-title {
			display: block;
			font-size: 0.97rem;
		}

		.back-link {
			display: inline-block;
			margin-top: 24px;
			color: #ffffff;
			text-decoration: none;
			padding: 8px 12px;
			border-radius: 6px;
			background: rgba(0, 0, 0, 0.5);
			border: 1px solid rgba(255, 255, 255, 0.2);
		}

		.back-link:hover,
		.back-link:focus-visible {
			background: rgba(0, 0, 0, 0.7);
		}

		@media (max-width: 700px) {
			main {
				padding: 18px;
			}

			h1 {
				font-size: clamp(26px, 8vw, 36px);
			}
		}
	</style>
</head>
<body>
	<main>
		<h1>Dev Logs</h1>
		<p class="subtitle">Each entry below links to its own page so you can write full updates separately.</p>

		<ul class="log-list">
			<!-- DEV_LOG_LIST_START -->
			<li class="log-item">
				<a class="log-link" href="dev_logs/2026-03-25.html">
					<span class="log-title">DevLog 1: The Story So Far</span>
					<span class="log-date">2026-03-25</span>
				</a>
			</li>
			<!-- DEV_LOG_LIST_END -->
		</ul>

		<a class="back-link" href="index.html">Back to homepage</a>
	</main>
</body>
</html>
