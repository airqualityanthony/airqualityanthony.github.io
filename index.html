<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="On The Air by White Paw Games. Wishlist now and stay tuned for updates.">
	<link rel="canonical" href="https://whitepawgames.co.uk/">

	<meta property="og:type" content="website">
	<meta property="og:site_name" content="On The Air">
	<meta property="og:title" content="On The Air - Coming Soon">
	<meta property="og:description" content="On The Air by White Paw Games. Wishlist now and stay tuned for updates.">
	<meta property="og:url" content="https://whitepawgames.co.uk/">
	<meta property="og:image" content="https://whitepawgames.co.uk/imgs/background_latest.png">
	<meta property="og:image:alt" content="On The Air promotional artwork">


	<title>On The Air</title>
	<link rel="icon" type="image/x-icon" href="imgs/favicon.jpg">
	<style>
		@font-face {
			font-family: 'OnTheAirHeading';
			src: url('W95font.otf') format('opentype');
			font-weight: normal;
			font-style: normal;
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			background-image: url('imgs/background_latest.png');
			background-size: cover;
			background-position: center top;
			background-repeat: no-repeat;
			background-attachment: scroll;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			font-family: Arial, sans-serif;
		}

		.header {
			position: fixed;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			z-index: 1000;
			pointer-events: none;
		}


		.icon-link {
			text-decoration: none;
			position: absolute;
			left: var(--x, 40px);
			top: var(--y, 40px);
			width: var(--icon-width, 120px);
			pointer-events: auto;
		}

		.icon-link img {
			width: 100%;
			height: auto;
			display: block;
			transition: transform 0.3s;
		}

		.icon-link img:hover {
			transform: scale(1.1);
		}

		.youtube-container {
			margin-top: 20px;
			width: 90%;
			max-width: 800px;
			aspect-ratio: 16 / 9;
		}

		.gif-container {
			position: relative;
			margin-top: 100px;
			width: 60%;
			max-width: 420px;
			margin-left: auto;
			margin-right: auto;
		}

		.gif-container img {
			width: 100%;
			height: auto;
			border-radius: 8px;
			display: block;
		}

		.base-gif {
			position: relative;
			z-index: 1;
		}

		.overlay-gif {
			position: absolute;
			top: 0;
			left: 0;
			z-index: 2;
			width: 100%;
			height: 100%;
			object-fit: contain;
			pointer-events: none;
		}

		.coming-soon {
			margin-top: 24px;
			margin-bottom: 16px;
			font-family: 'OnTheAirHeading', Arial, sans-serif;
			font-size: clamp(28px, 5vw, 56px);
			line-height: 1.1;
			text-align: center;
			letter-spacing: 0.04em;
			color: #ffffff;
			text-shadow: 0 2px 10px rgba(0, 0, 0, 0.65);
		}

		.company-brand {
			position: fixed;
			right: 24px;
			top: 50%;
			transform: translateY(-50%);
			z-index: 900;
			width: clamp(140px, 14vw, 260px);
			text-align: center;
		}

		.company-brand img {
			width: 100%;
			height: auto;
			display: block;
		}

		.company-brand-text {
			margin-top: 10px;
			font-family: 'OnTheAirHeading', Arial, sans-serif;
			font-size: clamp(14px, 1.6vw, 22px);
			color: #ffffff;
			text-shadow: 0 2px 10px rgba(0, 0, 0, 0.75);
		}

		@media (max-width: 900px) {
			.company-brand {
				position: static;
				transform: none;
				margin-top: 20px;
				width: min(50vw, 220px);
			}
		}

		.youtube-container iframe {
			width: 100%;
			height: 100%;
			border: none;
			border-radius: 8px;
		}
	</style>
</head>
<body>
	<div class="header">
		<a href="https://store.steampowered.com/wishlist/" class="icon-link" style="--x: 100px; --y: 300px; --icon-width: 170px;">
			<img src="imgs/steam_wishlist.png" alt="Icon 1">
		</a>
		<!-- <a href="https://discord.gg/fqFznfw7" class="icon-link" style="--x: 120px; --y: 300px; --icon-width: 140px;">
			<img src="imgs/discord.png" alt="Icon 2">
		</a> -->
		<a href="https://www.youtube.com/@whitepawgames_uk" class="icon-link" style="--x: 120px; --y: 500px; --icon-width: 130px;">
			<img src="imgs/youtube.png" alt="Icon 3">
		</a>
	</div>

	<div class="gif-container">
		<img class="base-gif" src="imgs/OnTheAir_IntroLogo.gif" alt="Featured GIF">
		<img class="overlay-gif" src="imgs/OnTheAir_IntroLogo_text.gif" alt="Overlay GIF">
	</div>

	<h1 class="coming-soon">On The Air - Coming Soon</h1>

	<div class="youtube-container">
		<iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID" allowfullscreen="" loading="lazy"></iframe>
	</div>

	<div class="company-brand">
		<img src="imgs\WhitePawsCompanyLogo_nohair.png" alt="Company logo">
		<p class="company-brand-text">White Paw Games</p>
	</div>
</body>
</html>
